<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador — Entre ou Cadastre-se</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tab-btns { display: flex; gap: 0; border: 1.5px solid var(--warm-200); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 1.75rem; }
    .tab-btn { flex: 1; padding: .65rem; font-size: .9rem; font-weight: 500; background: transparent; border: none; color: var(--warm-600); cursor: pointer; transition: all .2s; }
    .tab-btn.active { background: var(--purple-600); color: #fff; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .error-msg { font-size: .8rem; color: var(--danger); margin-top: .35rem; display: none; }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
<div class="auth-page">
  <!-- Brand panel -->
  <aside class="auth-brand" aria-hidden="true">
    <div class="auth-brand-logo">Organizador<span> de leituras</span></div>
    <p class="auth-brand-tagline">Seu universo literário, organizado.<br>Trilhas de leitura, notas e progresso.</p>
    <div class="auth-brand-deco">
      <span></span><span></span><span></span>
    </div>
  </aside>

  <!-- Form area -->
  <main class="auth-form-area">
    <div class="auth-card">
      <div class="auth-card-header">
        <h2>Bem-vindo</h2>
        <p>Organize sua jornada de leitura</p>
      </div>

      <!-- Tabs -->
      <div class="tab-btns" role="tablist">
        <button class="tab-btn active" role="tab" aria-selected="true" data-tab="login">Entrar</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="register">Cadastrar</button>
      </div>

      <!-- LOGIN -->
      <div class="tab-pane active" id="tab-login">
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="loginEmail">E-mail</label>
            <input class="form-control" type="email" id="loginEmail" placeholder="seu@email.com" required autocomplete="email">
            <p class="error-msg" id="loginEmailErr"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Senha</label>
            <input class="form-control" type="password" id="loginPassword" placeholder="••••••" required autocomplete="current-password">
            <p class="error-msg" id="loginPassErr"></p>
          </div>
          <p class="error-msg show" id="loginGlobalErr" style="display:none;margin-bottom:.75rem;"></p>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginBtn">Entrar</button>
        </form>
      </div>

      <!-- REGISTER -->
      <div class="tab-pane" id="tab-register">
        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="regName">Nome completo</label>
            <input class="form-control" type="text" id="regName" placeholder="Seu nome" required autocomplete="name">
            <p class="error-msg" id="regNameErr"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="regEmail">E-mail</label>
            <input class="form-control" type="email" id="regEmail" placeholder="seu@email.com" required autocomplete="email">
            <p class="error-msg" id="regEmailErr"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPassword">Senha</label>
            <input class="form-control" type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
            <p class="error-msg" id="regPassErr"></p>
          </div>
          <p class="error-msg" id="regGlobalErr" style="margin-bottom:.75rem;"></p>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="registerBtn">Criar conta</button>
        </form>
      </div>
    </div>
  </main>
</div>

<div id="toastContainer" class="toast-container"></div>

<script>
  window.API_BASE = 'http://localhost:5000/api';
</script>
<script src="js/api.js"></script>
<script>
  // Redirect if already logged in
  if (api.isLoggedIn()) window.location.href = 'pages/dashboard.html';

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      document.getElementById(`tab-${target}`).classList.add('active');
    });
  });

  function showErr(id, msg) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
  }

  // Login
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showErr('loginGlobalErr', '');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email) return showErr('loginEmailErr', 'Informe seu e-mail');
    if (!password) return showErr('loginPassErr', 'Informe sua senha');
    showErr('loginEmailErr', ''); showErr('loginPassErr', '');

    const btn = document.getElementById('loginBtn');
    setLoading(btn, true);
    try {
      const data = await api.auth.login({ email, password });
      api.setToken(data.token);
      api.setUser(data.user);
      showToast('success', 'Bem-vindo de volta!', data.user.name);
      setTimeout(() => window.location.href = 'pages/dashboard.html', 800);
    } catch (err) {
      showErr('loginGlobalErr', err.message);
      setLoading(btn, false);
    }
  });

  // Register
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showErr('regGlobalErr', '');
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    if (!name) return showErr('regNameErr', 'Informe seu nome');
    if (!email) return showErr('regEmailErr', 'Informe seu e-mail');
    if (password.length < 6) return showErr('regPassErr', 'Mínimo 6 caracteres');
    showErr('regNameErr',''); showErr('regEmailErr',''); showErr('regPassErr','');

    const btn = document.getElementById('registerBtn');
    setLoading(btn, true);
    try {
      const data = await api.auth.register({ name, email, password });
      api.setToken(data.token);
      api.setUser(data.user);
      showToast('success', 'Conta criada!', `Bem-vindo, ${data.user.name}!`);
      setTimeout(() => window.location.href = 'pages/dashboard.html', 800);
    } catch (err) {
      showErr('regGlobalErr', err.message);
      setLoading(btn, false);
    }
  });
</script>
</body>
</html>
